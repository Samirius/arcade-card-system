; =============================================================================
; Arcade Card System - Thin Client Reader Firmware (PlatformIO)
; =============================================================================
; Server-authoritative thin client:
;   - ONLINE : reads a card and calls the cloud to charge it (POST /charge)
;   - OFFLINE: authorizes within a signed Ed25519 envelope's caps, logs the
;              transaction to NVS, and reconciles on reconnect (POST /reconcile)
;
; This is an Arduino-framework project SPECIFICALLY so it can be compile-verified
; in CI without the full ESP-IDF toolchain. See README.md for the ESP-IDF
; production-migration rationale.
;
; Build:
;   PLATFORMIO_CORE_DIR=/agent/workspace/.pio \
;     pio run -d firmware/thinclient
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; -----------------------------------------------------------------------------
; Library dependencies
; -----------------------------------------------------------------------------
; - ArduinoJson         : request/response (de)serialization for the money path.
; - Adafruit PN532      : NFC/RFID front-end (PN532 over I2C/SPI). Guarded by
;                         USE_PN532_HW so the project still compiles on a build
;                         host that cannot fetch the lib (falls back to a stub
;                         UID source). Adafruit BusIO is a PN532 transitive dep.
;
; NOTE on crypto: Ed25519 verification is done with the *bundled* libsodium that
; ships inside framework-arduinoespressif32 (crypto_sign_verify_detached).
; No extra lib_dep is required for signature verification -- see crypto_ed25519.*
; -----------------------------------------------------------------------------
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit BusIO @ ^1.16.1

; -----------------------------------------------------------------------------
; Build flags
; -----------------------------------------------------------------------------
; USE_PN532_HW = 0  -> compile against the stub card reader (no hardware libs
;                      strictly required at runtime; CI-friendly default).
;                = 1 -> compile against the real Adafruit_PN532 driver.
;
; THINCLIENT_ALLOW_INSECURE_TLS = 1 lets the pilot run with setInsecure() when a
;                      pinned root CA has not been provisioned yet. Set to 0 for
;                      any real deployment so the money path fails closed.
; -----------------------------------------------------------------------------
build_flags =
    -DUSE_PN532_HW=0
    -DTHINCLIENT_ALLOW_INSECURE_TLS=1
    -DARDUINOJSON_USE_LONG_LONG=1
    -std=gnu++17

build_unflags =
    -std=gnu++11

; Uncomment to build against real PN532 hardware:
; [env:esp32dev_pn532]
; extends = env:esp32dev
; build_flags =
;     ${env:esp32dev.build_flags}
;     -UUSE_PN532_HW
;     -DUSE_PN532_HW=1
