name: CI

# Monorepo quality gate — path-scoped: each domain job runs only when its
# files change, and the single "CI OK" summary job is the one check to mark
# as *required* in branch protection (it passes when domain jobs are skipped,
# fails when any of them fail).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Detect which parts of the monorepo this change touches
  # ------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            firmware:
              - 'firmware/**'
              - 'platformio.ini'
              - '.github/workflows/ci.yml'

  # ------------------------------------------------------------------
  # BACKEND — pytest suite, Alembic gate, E2E harness, legacy SQL check
  # ------------------------------------------------------------------
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: arcade_user
          POSTGRES_PASSWORD: arcade_password
          POSTGRES_DB: arcade_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://arcade_user:arcade_password@localhost:5432/arcade_management
      SECRET_KEY: ci_test_secret_key_0123456789_abcdef
      ENVIRONMENT: development
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install email-validator "qrcode[pil]" slowapi pyotp pytest httpx==0.25.2 requests

      - name: Prepare database (uuid-ossp extension)
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      # --- Alembic is the schema source of truth (BE-5) ---
      - name: Alembic upgrade head (fresh database)
        working-directory: backend
        run: PYTHONPATH=. python -m alembic upgrade head

      - name: Alembic drift check (models == migrations)
        working-directory: backend
        run: PYTHONPATH=. python -m alembic check

      - name: Alembic reversibility (downgrade base, re-upgrade)
        working-directory: backend
        run: |
          PYTHONPATH=. python -m alembic downgrade base
          PYTHONPATH=. python -m alembic upgrade head

      # --- Test suites (each resets its own schema) ---
      - name: Run pytest suite
        working-directory: backend
        run: PYTHONPATH=. python -m pytest tests -q

      - name: Run E2E verification harness
        working-directory: backend
        run: PYTHONPATH=. python tests_integration/run_verification.py

      - name: Run concurrency/overdraft test
        working-directory: backend
        run: PYTHONPATH=. python tests_integration/conc_db.py

      # Wipes the schema — must stay LAST.
      - name: Legacy SQL migration apply check
        working-directory: backend
        run: bash tests_integration/check_migrations.sh "$DATABASE_URL"

  # ------------------------------------------------------------------
  # FRONTEND — type-check + production build (vue-tsc -b && vite build)
  # ------------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ------------------------------------------------------------------
  # FIRMWARE — PlatformIO compile (ADVISORY until a buildable project
  # lands on main; flip continue-on-error to false to make it blocking).
  # Auto-detects the project: builds firmware/thinclient/ if it has its
  # own platformio.ini (the PR #3 layout), otherwise tries the root
  # platformio.ini only when a [platformio] src_dir is configured.
  # ------------------------------------------------------------------
  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile firmware
        run: |
          if [ -f firmware/thinclient/platformio.ini ]; then
            echo "Building firmware/thinclient (dedicated PlatformIO project)"
            pio run -d firmware/thinclient
          elif grep -q "src_dir" platformio.ini 2>/dev/null; then
            echo "Building from root platformio.ini"
            pio run
          else
            echo "::warning::No buildable PlatformIO project found."
            echo "Root platformio.ini has no [platformio] src_dir, so the legacy"
            echo ".ino cannot be built. This job will start compiling automatically"
            echo "once the thin-client firmware (PR #3 layout) lands on main."
          fi

  # ------------------------------------------------------------------
  # CI OK — the single required status check for branch protection.
  # Passes when domain jobs succeed OR are skipped (path-scoped);
  # fails when any of them fail or are cancelled.
  # NOTE: firmware has continue-on-error, so it reports success even on
  # failure — advisory by design for now.
  # ------------------------------------------------------------------
  ci-ok:
    if: always()
    needs: [changes, backend, frontend, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        run: |
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "firmware: ${{ needs.firmware.result }} (advisory)"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::A required CI job failed."
            exit 1
          fi
          echo "All required jobs green (or skipped by path filter)."
