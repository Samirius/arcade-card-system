[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# NOTE: keep addopts plugin-free. Putting --cov here makes pytest exit with
# usage error 4 in any environment without pytest-cov (CI, fresh clones).
# For coverage, run:  pytest --cov=app --cov-report=term-missing
addopts =
    -v
    --strict-markers