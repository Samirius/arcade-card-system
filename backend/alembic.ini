# Alembic configuration for the Arcade Management System.
#
# The database URL is intentionally NOT hardcoded here; env.py reads it from the
# DATABASE_URL environment variable (falling back to the app settings) so the
# same config works across dev/staging/prod.

[alembic]
# Path to migration scripts (relative to this file's directory).
script_location = migrations/alembic

# Template used to generate migration file names.
# (No `timezone` option so we avoid a hard python-dateutil dependency.)
file_template = %%(rev)s_%%(slug)s

# sys.path additions (env.py also injects the backend dir explicitly).
prepend_sys_path = .

# sqlalchemy.url is populated at runtime by env.py from DATABASE_URL.
sqlalchemy.url =


[post_write_hooks]
# (none)


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
